# Wavelet-image DDPM (Takahashi & Mizuno, 2025). Sources in comments.
model: diffusion

window: 256              # power of 2 required by the DWT (paper uses 512 after mirror expansion of 390 minutes)
stride: 20               # earlier thesis setting; paper uses one image per trading day (no sliding window)

power_p: 1.5             # paper Sec. 3: p = 1.5 for log returns
winsor_z: 10.0           # paper Sec. 3
image_scaling: minmax    # not specified in paper; one global map to [-1, 1] fitted on training images

base_channels: 128       # paper: 128-128-256-256-512 (Hugging Face DDPM tutorial)
channel_mults: [1, 1, 2, 2, 4]
time_emb_dim: 512
num_heads: 8

T: 1000                  # Ho et al. (2020) default; paper defers to the tutorial
beta_start: 1.0e-4
beta_end: 0.02

epochs: 100              # paper Sec. 4
batch_size: 32
lr: 1.0e-4
log_every: 5

# generation for evaluation
n_generate: 1000
out_len: 250             # evaluated on the same 250-return length as the MMD-Signature model
